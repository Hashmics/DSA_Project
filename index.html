<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="style.css" />
    <title>FORM</title>
  </head>

  <body>
    <div class="container">
      <h1>Login Form</h1>

        <select id="country">
          <option value="australia">AUSTRALIA</option>
          <option value="pakistan">PAKISTAN</option>
          <option value="itlay">ITLAY</option>
        </select>
        <input type="sumbit" value="Sumbit" />
      </form>
    </div>
  </body>
</html>
